<!DOCTYPE html>
<html lang="en">
<head>
    <title>Navigation</title>
    <link rel="stylesheet" href="style.css">
    <style>
    .nav-bar a {
        font-family: 'Times New Roman', Times, serif;
    }
    /* Style tambahan untuk badge cart di navbar */
    #cart-link {
        position: relative;
        text-decoration: none;
    }
    #cart-count {
        background: #daa520;
        color: #000;
        padding: 2px 6px;
        border-radius: 50%;
        font-size: 11px;
        font-weight: bold;
        margin-left: 3px;
    }

    
    </style>
</head>
<body style="background-color: #000; text-align: center; color: #fff;">
    <div id="nav-bar">
        <header class="brand-logo"></header> Atelier
        <a href="home.html" target="main_content" class="nav-link">HOME</a>
        <a href="products.html" target="main_content" class="nav-link">COLLECTIONS</a>
        <a href="about.html" target="main_content" class="nav-link">ABOUT</a>
        <a href="contact.html" target="main_content" class="nav-link">CONTACT</a>
        
        <!-- Menu Cart ditambahkan di sini, lengkap dengan id cart-count -->
        <a href="cart.html" target="main_content" class="nav-link" id="cart-link">CART <span id="cart-count">0</span></a>
        
        <a href="login.html" target="main_content" class="nav-link">LOGIN</a>
    </div>

    <!-- Script kecil agar badge cart di navbar ikut ter-update otomatis -->
    <script>
        function updateCartNavbar() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const cartCountEl = document.getElementById("cart-count");
            if (cartCountEl) {
                cartCountEl.textContent = cart.length;
            }
        }
        
        // Jalankan saat file navigation dimuat
        updateCartNavbar();
        
        // Sinkronisasi real-time jika ada perubahan dari tab/halaman lain
        window.addEventListener("storage", updateCartNavbar);
    </script>
</body>
</html>
