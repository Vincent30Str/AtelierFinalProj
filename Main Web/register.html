<!DOCTYPE html>
<html lang="en">
<head>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="login-container">
    <h1><u>ATELIER</u></h1>
    <form id="registerForm">
      <label>Email *</label>
      <input type="email" name="email" placeholder="enter your Email" class="login-bar" required>

      <label>Password *</label>
      <input type="password" id="password" placeholder="Enter your password" class="login-bar" minlength="8" required>

       <label>Password confirm*</label>
      <input type="password" id="passwordConfirm" placeholder="Enter your password again" class="login-bar" minlength="8" required>


      <!-- Gender Selection -->
<label>Gender *</label>
<div class="gender-options">
  <input type="radio" id="male" name="gender" value="male" required>
  <label for="male">Male</label>
  
  <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label>
</div>

<!-- Country Selection -->
<label for="country">Which country are you from? *</label>
<select id="country" name="country" required>
  <option value="">-- Select your country --</option>
  <option value="indonesia">Indonesia</option>
  <option value="usa">United States</option>
  <option value="uk">United Kingdom</option>
  <option value="japan">Japan</option>
  <option value="china">China</option>
  <option value="india">India</option>
  <option value="other">Other</option>
</select>


      <p class="account-link">Have an Account? <a href="login.html">Login</a></p>

      <button type="submit">Register</button>
      <button type="button" class="google-btn" onclick="alert('Google registration is unavailable in this static demo.')">Or Register using Google</button>
    </form>
  </div>
  <script>
    document.getElementById("registerForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const password = document.getElementById("password");
      const confirmation = document.getElementById("passwordConfirm");
      if (password.value !== confirmation.value) {
        confirmation.setCustomValidity("Passwords do not match.");
        confirmation.reportValidity();
        return;
      }
      confirmation.setCustomValidity("");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
