<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Status - Atelier</title>
    <link rel="stylesheet" href="/Main Web/styles/products.css" />
    <link rel="stylesheet" href="/Main Web/styles/order-status.css" />
</head>
<body>

  <div class="status-container">
    <h2>Your Order & Shipping Status</h2>
    
    <div id="orderDetails">
        <!-- Detail pesanan dan resi dimuat di sini -->
    </div>

    <a href="products.html" class="back-btn">← Back to Collections</a>
  </div>

  <script>
    function loadOrderStatus() {
        const orderData = JSON.parse(localStorage.getItem("latest_order"));
        const container = document.getElementById("orderDetails");

        if (!orderData) {
            container.innerHTML = `<p class="no-orders">No active orders found.</p>`;
            return;
        }

        container.innerHTML = `
            <div class="order-card">
                <p><strong>Order ID:</strong> <span class="highlight">${orderData.id}</span></p>
                <p><strong>Recipient Name:</strong> ${orderData.customerName}</p>
                <p><strong>Shipping Address:</strong> ${orderData.address}</p>
                <p><strong>Courier Service:</strong> ${orderData.courier}</p>
                <p><strong>Total Payment:</strong> <span class="highlight">${orderData.totalPayment}</span></p>
                <hr class="order-divider">
                <p><strong>Order Status:</strong> <span class="badge">${orderData.status}</span></p>
                <p><strong>Tracking Number (Resi):</strong> <span class="highlight tracking-number">${orderData.trackingNumber}</span></p>
            </div>
        `;
    }

    loadOrderStatus();
  </script>

</body>
</html>
