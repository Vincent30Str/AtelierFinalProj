<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page - Atelier</title>
  <link rel="stylesheet" href="/Main Web/styles/login.css">
</head>
<body>
  <div class="login-container">
    <h1><u>ATELIER</u></h1>
    <form onsubmit="handleLogin(event)">
      <label>Login (Email) *</label>
      <input type="text" id="loginEmail" placeholder="Enter your login" class="login-bar" required>

      <label>Password *</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" class="login-bar" required>

      <div class="extra-options">
        <a href="register.html">Forgot password? Register account</a>
        <label><input type="checkbox" id="rememberMe"> Remember me</label>
      </div>

      <p class="account-link">Not yet have an Account? <a href="register.html">Register</a></p>

      <button type="submit">Login</button>
      <button type="button" class="google-btn" onclick="alert('Google login is unavailable in this static demo.')">Or Login using Google</button>
    </form>
  </div>

  <script>
    function handleLogin(event) {
        event.preventDefault();
        
        const email = document.getElementById("loginEmail").value;
        const rememberMe = document.getElementById("rememberMe").checked;
        localStorage.setItem("atelier_user_email", rememberMe ? email : "");
        window.location.href = "products.html";
    }
  </script>
</body>
</html>
