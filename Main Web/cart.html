<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart & Shipping - Atelier</title>
    <link rel="stylesheet" href="products.css" />
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Times New Roman', Times, serif;
        }
        .cart-container {
            max-width: 900px;
            margin: 100px auto 50px auto;
            background: #1f1f1f;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #daa520;
        }
        .cart-container h2 {
            font-size: 2rem;
            color: #daa520;
            margin-bottom: 20px;
            text-align: center;
        }
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #181818;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: #fff;
            border-radius: 5px;
            padding: 5px;
        }
        .cart-item-info {
            flex-grow: 1;
            margin-left: 20px;
        }
        .cart-item-info h4 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #fff;
        }
        .cart-item-info p {
            color: #daa520;
            font-weight: bold;
        }
        
        /* Tombol Love & Tag Wishlisted di Cart */
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .wishlist-heart {
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }
        .wishlist-heart:hover {
            transform: scale(1.2);
        }
        .wishlist-tag {
            display: inline-block;
            background: #daa520;
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 5px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .remove-btn {
            background: #fa002a;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .remove-btn:hover {
            background: #cc0022;
        }
        
        .checkout-section {
            margin-top: 30px;
            border-top: 1px solid #333;
            padding-top: 20px;
            display: none;
        }
        .checkout-section h3 {
            color: #daa520;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
        }
        
        .cart-summary {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .summary-total {
            font-size: 1.4rem;
            color: #daa520;
            font-weight: bold;
        }
        .cart-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .btn-link {
            background: #2b2b2b;
            color: #daa520;
            padding: 10px 25px;
            border: 1px solid #daa520;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-link:hover {
            background: #daa520;
            color: #000;
        }
        .main-btn {
            background: #daa520;
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .main-btn:hover {
            background: #f9a805;
        }
        .empty-cart {
            text-align: center;
            color: #888;
            font-size: 1.2rem;
            padding: 40px 0;
        }

        .shipping-info-box {
            margin-top: 30px;
            background: #181818;
            border: 1px solid #daa520;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        .shipping-info-box h3 {
            color: #daa520;
            margin-bottom: 15px;
        }
        .shipping-info-box p {
            margin: 8px 0;
            font-size: 1.05rem;
        }
        .badge {
            background: #daa520;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        #toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #daa520;
            color: #000;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

  <div id="toast-notification">Order successfully placed!</div>

  <div class="cart-container">
    <h2>Shopping Cart & Shipping Info</h2>
    
    <div id="cartItemsList">
        <!-- Item keranjang -->
    </div>

    <!-- FORM CHECKOUT -->
    <div id="checkoutFormSection" class="checkout-section">
        <h3>Shipping Details</h3>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="custName" placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label>Shipping Address</label>
            <textarea id="custAddress" rows="3" placeholder="Enter complete address (e.g., Mustika Golf Residence)"></textarea>
        </div>
        <div class="form-group">
            <label>Select Courier / Shipping Method</label>
            <select id="courierSelect" onchange="calculateTotal()">
                <option value="0|None">-- Choose Courier Service --</option>
                <option value="15|LionParcel (Same Day)">LionParcel (Same Day) - $15</option>
                <option value="10|JNE (2-3 Days)">JNE (2-3 Days) - $10</option>
                <option value="5|Reguler Economy">Reguler Economy (4-7 Days) - $5</option>
            </select>
        </div>
    </div>

    <!-- RINGKASAN & TOMBOL -->
    <div class="cart-summary" id="summarySection">
        <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotalText">$0</span>
        </div>
        <div class="summary-row">
            <span>Shipping Fee:</span>
            <span id="shippingText">$0</span>
        </div>
        <div class="summary-row summary-total">
            <span>Total Payment:</span>
            <span id="grandTotalText">$0</span>
        </div>

        <div class="cart-actions">
            <a href="products.html" class="btn-link">← Continue Shopping</a>
            <div>
                <button id="viewShippingBtn" class="btn-link" style="display:none;" onclick="toggleShippingInfo()">View Shipping Info</button>
                <button id="actionBtn" class="main-btn" onclick="proceedOrSubmit()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- KOTAK INFO PENGIRIMAN -->
    <div id="shippingInfoSection" class="shipping-info-box">
        <h3>Active Order & Tracking Info</h3>
        <div id="shippingDetailsContent"></div>
    </div>
  </div>

  <script>
    let subtotalAmount = 0;
    let isCheckingOut = false;
    let shippingCost = 0;
    let courierName = "-";

    function loadCart() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let wishlist = JSON.parse(localStorage.getItem("atelier_wishlist")) || [];
        const cartList = document.getElementById("cartItemsList");
        
        cartList.innerHTML = "";

        let activeOrder = JSON.parse(localStorage.getItem("latest_order"));
        if (activeOrder) {
            document.getElementById("viewShippingBtn").style.display = "inline-block";
        }

        if (cart.length === 0) {
            cartList.innerHTML = `<div class="empty-cart">Your cart is currently empty.</div>`;
            document.getElementById("subtotalText").textContent = "$0";
            document.getElementById("shippingText").textContent = "$0";
            document.getElementById("grandTotalText").textContent = "$0";
            if (!isCheckingOut) {
                document.getElementById("actionBtn").style.display = "none";
            }
            return;
        }

        subtotalAmount = 0;
        cart.forEach((item, index) => {
            let cleanPrice = parseFloat(item.price.replace('$', '').replace(/\./g, '').replace(',', '')) || 0;
            subtotalAmount += cleanPrice;

            // Cek apakah item di cart ini sudah di-wishlist
            let isWishlisted = wishlist.some(wItem => wItem.title === item.title);
            let heartIcon = isWishlisted ? "❤️" : "🤍";
            let wishlistBadge = isWishlisted ? `<br><span class="wishlist-tag">Wishlisted! Checkout now!</span>` : "";

            cartList.innerHTML += `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.title}">
                    <div class="cart-item-info">
                        <h4>${item.title}</h4>
                        <p>${item.price}</p>
                        ${wishlistBadge}
                    </div>
                    <div class="cart-item-actions">
                        <span class="wishlist-heart" onclick="toggleCartWishlist('${item.title}')">${heartIcon}</span>
                        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                    </div>
                </div>
            `;
        });

        calculateTotal();
    }

    // Fungsi untuk Toggle Wishlist langsung dari dalam Cart
    function toggleCartWishlist(productTitle) {
        let wishlist = JSON.parse(localStorage.getItem("atelier_wishlist")) || [];
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        let itemToWishlist = cart.find(item => item.title === productTitle);
        if (!itemToWishlist) return;

        let existingIndex = wishlist.findIndex(item => item.title === productTitle);

        if (existingIndex > -1) {
            // Unwishlist
            wishlist.splice(existingIndex, 1);
            showToast("Removed from wishlist");
        } else {
            // Wishlist
            wishlist.push(itemToWishlist);
            showToast("Added to wishlist ❤️");
        }

        localStorage.setItem("atelier_wishlist", JSON.stringify(wishlist));
        loadCart(); // Refresh cart untuk update tampilan tag & icon love
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
    }

    function proceedOrSubmit() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        if (cart.length === 0 && !isCheckingOut) {
            alert("Your cart is empty!");
            return;
        }

        if (!isCheckingOut) {
            document.getElementById("checkoutFormSection").style.display = "block";
            document.getElementById("actionBtn").textContent = "Place Order Now";
            isCheckingOut = true;
        } else {
            const name = document.getElementById("custName").value;
            const address = document.getElementById("custAddress").value;
            const courierVal = document.getElementById("courierSelect").value;

            if (!name || !address || courierVal.startsWith("0")) {
                alert("Please fill in your name, address, and select a courier service!");
                return;
            }

            const parts = courierVal.split("|");
            shippingCost = parseInt(parts[0]);
            courierName = parts[1];
            let grandTotal = subtotalAmount + shippingCost;

            let newOrder = {
                id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
                customerName: name,
                address: address,
                courier: courierName,
                items: cart,
                totalPayment: `$${grandTotal.toLocaleString()}`,
                status: "Processing / Packed",
                trackingNumber: "-"
            };

            let orders = JSON.parse(localStorage.getItem("atelier_orders")) || [];
            orders.push(newOrder);
            localStorage.setItem("atelier_orders", JSON.stringify(orders));
            localStorage.setItem("latest_order", JSON.stringify(newOrder));

            localStorage.removeItem("cart");

            showToast("Order successfully placed!");
            
            isCheckingOut = false;
            document.getElementById("checkoutFormSection").style.display = "none";
            document.getElementById("actionBtn").style.display = "none";
            loadCart();
            toggleShippingInfo();
        }
    }

    function calculateTotal() {
        const courierSelect = document.getElementById("courierSelect");
        const val = courierSelect.value.split("|");
        shippingCost = isCheckingOut ? parseInt(val[0]) || 0 : 0;
        
        let grandTotal = subtotalAmount + shippingCost;

        document.getElementById("subtotalText").textContent = `$${subtotalAmount.toLocaleString()}`;
        document.getElementById("shippingText").textContent = `$${shippingCost.toLocaleString()}`;
        document.getElementById("grandTotalText").textContent = `$${grandTotal.toLocaleString()}`;
    }

    function toggleShippingInfo() {
        const section = document.getElementById("shippingInfoSection");
        const content = document.getElementById("shippingDetailsContent");
        let activeOrder = JSON.parse(localStorage.getItem("latest_order"));

        if (!activeOrder) {
            alert("No active orders found.");
            return;
        }

        if (section.style.display === "block") {
            section.style.display = "none";
        } else {
            content.innerHTML = `
                <p><strong>Order ID:</strong> <span style="color:#daa520;">${activeOrder.id}</span></p>
                <p><strong>Recipient:</strong> ${activeOrder.customerName}</p>
                <p><strong>Address:</strong> ${activeOrder.address}</p>
                <p><strong>Courier:</strong> ${activeOrder.courier}</p>
                <p><strong>Total Payment:</strong> <span style="color:#daa520;">${activeOrder.totalPayment}</span></p>
                <hr style="border-color: #333; margin: 10px 0;">
                <p><strong>Status:</strong> <span class="badge">${activeOrder.status}</span></p>
                <p><strong>Tracking Number (Resi):</strong> <span style="color:#daa520; font-size:1.2rem;">${activeOrder.trackingNumber}</span></p>
            `;
            section.style.display = "block";
        }
    }

    function showToast(message) {
        const toast = document.getElementById("toast-notification");
        if (!toast) return;
        toast.textContent = message;
        toast.style.display = "block";
        setTimeout(() => {
            toast.style.display = "none";
        }, 2000);
    }

    loadCart();
  </script>

</body>
</html>
