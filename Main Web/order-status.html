<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Status - Atelier</title>
    <link rel="stylesheet" href="products.css" />
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Times New Roman', Times, serif;
        }
        .status-container {
            max-width: 800px;
            margin: 120px auto 50px auto;
            background: #1f1f1f;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #daa520;
        }
        .status-container h2 {
            color: #daa520;
            text-align: center;
            margin-bottom: 25px;
        }
        .order-card {
            background: #181818;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        .order-card p {
            margin: 8px 0;
            font-size: 1.1rem;
        }
        .highlight {
            color: #daa520;
            font-weight: bold;
        }
        .badge {
            background: #daa520;
            color: #000;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .back-btn {
            display: inline-block;
            background: #daa520;
            color: #000;
            padding: 10px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .back-btn:hover {
            background: #f9a805;
        }
    </style>
</head>
<body>

  <div class="status-container">
    <h2>Your Order & Shipping Status</h2>
    
    <div id="orderDetails">
        <!-- Detail pesanan dan resi dimuat di sini -->
    </div>

    <a href="products.html" class="back-btn">← Back to Collections</a>
  </div>

  <script>
    function loadOrderStatus() {
        const orderData = JSON.parse(localStorage.getItem("latest_order"));
        const container = document.getElementById("orderDetails");

        if (!orderData) {
            container.innerHTML = `<p style="text-align:center; color:#888;">No active orders found.</p>`;
            return;
        }

        container.innerHTML = `
            <div class="order-card">
                <p><strong>Order ID:</strong> <span class="highlight">${orderData.id}</span></p>
                <p><strong>Recipient Name:</strong> ${orderData.customerName}</p>
                <p><strong>Shipping Address:</strong> ${orderData.address}</p>
                <p><strong>Courier Service:</strong> ${orderData.courier}</p>
                <p><strong>Total Payment:</strong> <span class="highlight">${orderData.totalPayment}</span></p>
                <hr style="border-color: #333; margin: 15px 0;">
                <p><strong>Order Status:</strong> <span class="badge">${orderData.status}</span></p>
                <p><strong>Tracking Number (Resi):</strong> <span class="highlight" style="font-size: 1.3rem;">${orderData.trackingNumber}</span></p>
            </div>
        `;
    }

    loadOrderStatus();
  </script>

</body>
</html>
